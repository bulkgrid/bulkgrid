name: Check Python SDK

on:
  pull_request:
    paths:
      - 'packages/sdk-python/**'
      - 'openapi/bulkgrid.openapi.json'
      - '.github/workflows/check-python-sdk.yml'
      - '.github/workflows/publish-python-sdk.yml'
  push:
    branches: [main]
    paths:
      - 'packages/sdk-python/**'
      - 'openapi/bulkgrid.openapi.json'
      - '.github/workflows/check-python-sdk.yml'
      - '.github/workflows/publish-python-sdk.yml'
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e 'packages/sdk-python[dev]'
      - run: python packages/sdk-python/scripts/generate.py --check
      - run: python -m pytest packages/sdk-python/tests
      - run: python -m mypy --config-file packages/sdk-python/pyproject.toml packages/sdk-python/src/bulkgrid
      - run: python -m ruff check packages/sdk-python
      - run: python -m ruff format --check packages/sdk-python
      - run: python -m build packages/sdk-python
      - run: python -m pip install --force-reinstall --no-deps packages/sdk-python/dist/*.whl
      - run: python -m pytest packages/sdk-python/tests
