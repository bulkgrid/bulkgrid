name: Prepare plugin release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing plugin-v<version> tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: plugin-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  artifacts:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Check tag syntax
        env:
          PLUGIN_TAG: ${{ inputs.tag }}
        run: |
          [[ "$PLUGIN_TAG" =~ ^plugin-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check source version
        id: source
        env:
          PLUGIN_TAG: ${{ inputs.tag }}
        run: |
          npm run plugins:check-version
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm run check
      - run: npm run plugins:archive
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-release
          path: dist/plugins/
          if-no-files-found: error

  draft:
    needs: artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugin-release
          path: release-files
      - name: Attach artifacts to a new draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLUGIN_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ needs.artifacts.outputs.commit }}
        run: |
          [[ "$PLUGIN_TAG" =~ ^plugin-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          gh release create "$PLUGIN_TAG" release-files/* \
            --draft --verify-tag --target "$SOURCE_COMMIT" \
            --title "Bulkgrid plugin ${PLUGIN_TAG#plugin-v}" \
            --notes "Prepared artifacts for source $SOURCE_COMMIT. Client acceptance and marketplace approvals must be recorded before publication."
